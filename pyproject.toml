[project]
name = "nanomodem"
version = "1.1.0"
description = "Acoustic modem localization system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scipy>=1.10.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
demo = [
    "tkintermapview>=1.29",
    "customtkinter",
    "pillow",
]
dev = [
    "pytest>=7.0",
    "mypy>=1.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
nanomodem-demo = "nanomodem.demo.scenarios.mock_4_nodes:main"
nanomodem-controller = "nanomodem.demo.scenarios.single_node:main"
nanomodem-bridge = "nanomodem.demo.scenarios.serial_bridge_2_nodes:main"
nanomodem-simulator = "nanomodem.demo.simulator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanomodem"]

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["src/nanomodem/tests", "temp_experiments_to_be_removed_later/tests"]
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_parser = "conventional"
build_command = """
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
"""
