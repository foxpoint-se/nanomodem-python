[project]
name = "foxpoint-nanomodem"
version = "0.1.0"
description = "Acoustic modem localization system (foxpoint.nanomodem)"
requires-python = ">=3.12"
dependencies = [
    "scipy>=1.10.0",
    "pyserial>=3.5",
    "tkintermapview>=1.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["foxpoint*"]

[tool.pytest.ini_options]
testpaths = ["src/foxpoint/nanomodem/tests"]
pythonpath = ["src"]
