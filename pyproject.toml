[project]
name = "nanomodem-workspace"
version = "0.0.0"
description = "Development workspace for nanomodem packages"
requires-python = ">=3.12"
dependencies = [
    "nanomodem",
    "nanomodem-demo",
    "nanomodem-cli",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
nanomodem = { workspace = true }
nanomodem-demo = { workspace = true }
nanomodem-cli = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=7.0",
    "mypy>=1.0.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/nanomodem/src/nanomodem/tests",
    "packages/nanomodem/src/nanomodem/core/tests",
    "packages/nanomodem/src/nanomodem/core/transports/tests",
    "packages/nanomodem/src/nanomodem/positioning/tests",
    "packages/nanomodem-demo/tests",
    "packages/nanomodem-cli/tests",
]
pythonpath = [
    "packages/nanomodem/src",
    "packages/nanomodem-demo/src",
    "packages/nanomodem-cli/src",
]
python_classes = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "packages/nanomodem/src:packages/nanomodem-demo/src:packages/nanomodem-cli/src"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
version_toml = [
    "packages/nanomodem/pyproject.toml:project.version",
    "packages/nanomodem-demo/pyproject.toml:project.version",
    "packages/nanomodem-cli/pyproject.toml:project.version",
]
tag_format = "v{version}"
commit_parser = "conventional"
build_command = """
uv lock --upgrade-package nanomodem --upgrade-package nanomodem-demo --upgrade-package nanomodem-cli
git add uv.lock
"""
