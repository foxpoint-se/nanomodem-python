[project]
name = "foxpoint-nanomodem"
version = "0.1.0"
description = "Acoustic modem localization system (foxpoint.nanomodem)"
requires-python = ">=3.12"
dependencies = [
    "scipy>=1.10.0",
    "pyserial>=3.5",
    "tkintermapview>=1.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["foxpoint*"]

[tool.pytest.ini_options]
testpaths = ["src/foxpoint/nanomodem/tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
