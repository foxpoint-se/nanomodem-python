[project]
name = "nanomodem-demo"
version = "2.0.0"
description = "GUI demo applications and scenarios for nanomodem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nanomodem",
    "tkintermapview>=1.29",
    "customtkinter",
    "pillow",
]

[project.scripts]
nanomodem-demo = "nanomodem_demo.scenarios.mock_4_nodes:main"
nanomodem-controller = "nanomodem_demo.scenarios.single_node:main"
nanomodem-bridge = "nanomodem_demo.scenarios.serial_bridge_2_nodes:main"
nanomodem-simulator = "nanomodem_demo.simulator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanomodem_demo"]

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv.sources]
nanomodem = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
