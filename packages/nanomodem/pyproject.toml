[project]
name = "nanomodem"
version = "2.0.0"
description = "Acoustic modem communication and localization library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scipy>=1.10.0",
    "pyserial>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanomodem"]

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["src/nanomodem/tests"]
pythonpath = ["src"]
